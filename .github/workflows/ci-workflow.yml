name: CI

on: [push]

jobs:
  linux-build:
    runs-on: ubuntu-latest

    env:
      JOBS: 4
      IBIS_OCIO: ON
      IBIS_JPEG: ON
      IBIS_TIFF: ON
      IBIS_EXR: ON
      IBIS_FFMPEG: ON
      IBIS_FFMPEG_MINIMAL: OFF
      IBIS_OIIO: ON
      IBIS_USD: OFF
      IBIS_PYTHON: OFF
      IBIS_TESTS: ON
      IBIS_GCOV: ON
      FTK_API: GL_4_1
      BUILD_SHARED_LIBS: OFF

    steps:
    - uses: actions/checkout@v4
      with:
        path: ibis
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Debug/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh ibis/etc/Linux/linux-setup-gha.sh

    - name: Build ibis
      run: sh ibis/etc/Linux/linux-build-gha.sh Debug

    - name: Run tests
      run: xvfb-run build-Debug/tests/ibistest/ibistest
    
    - name: Code coverage
      if: env.IBIS_GCOV == 'ON'
      run: |
        cd build-Debug
        sh ../ibis/etc/Linux/lcov.sh

  linux-minimal-build:
    runs-on: ubuntu-latest

    env:
      JOBS: 4
      IBIS_OCIO: OFF
      IBIS_JPEG: OFF
      IBIS_TIFF: OFF
      IBIS_EXR: OFF
      IBIS_FFMPEG: OFF
      IBIS_FFMPEG_MINIMAL: OFF
      IBIS_OIIO: OFF
      IBIS_USD: OFF
      IBIS_PYTHON: OFF
      IBIS_TESTS: ON
      FTK_API: GL_4_1
      BUILD_SHARED_LIBS: OFF

    steps:
    - uses: actions/checkout@v4
      with:
        path: ibis
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Debug/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh ibis/etc/Linux/linux-setup-gha.sh

    - name: Build ibis
      run: sh ibis/etc/Linux/linux-build-gha.sh Debug

    - name: Run tests
      run: xvfb-run build-Debug/tests/ibistest/ibistest

  linux-gles2-minimal-build:
    runs-on: ubuntu-latest

    env:
      JOBS: 4
      IBIS_OCIO: OFF
      IBIS_JPEG: ON
      IBIS_TIFF: ON
      IBIS_EXR: ON
      IBIS_FFMPEG: OFF
      IBIS_FFMPEG_MINIMAL: OFF
      IBIS_OIIO: OFF
      IBIS_USD: OFF
      IBIS_PYTHON: OFF
      IBIS_TESTS: ON
      FTK_API: GLES_2
      BUILD_SHARED_LIBS: OFF

    steps:
    - uses: actions/checkout@v4
      with:
        path: ibis
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$PWD/install-Debug/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version
        sh ibis/etc/Linux/linux-setup-gha.sh

    - name: Build ibis
      run: sh ibis/etc/Linux/linux-build-gha.sh Debug

    - name: Run tests
      run: xvfb-run build-Debug/tests/ibistest/ibistest

  macos-build:
    runs-on: macos-latest

    env:
      JOBS: 4
      IBIS_OCIO: ON
      IBIS_JPEG: ON
      IBIS_TIFF: ON
      IBIS_EXR: ON
      IBIS_FFMPEG: ON
      IBIS_FFMPEG_MINIMAL: OFF
      IBIS_OIIO: ON
      IBIS_USD: OFF
      IBIS_PYTHON: OFF
      IBIS_TESTS: ON
      IBIS_GCOV: OFF
      FTK_API: GL_4_1
      BUILD_SHARED_LIBS: OFF
      CMAKE_OSX_DEPLOYMENT_TARGET: 14
      CMAKE_OSX_ARCHITECTURES: arm64

    steps:
    - uses: actions/checkout@v4
      with:
        path: ibis
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # \bug DYLD_LIBRARY_PATH is not being set here?
    - name: Setup environment
      run: |
        echo "$PWD/install-Debug/bin" >> $GITHUB_PATH
        echo "DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$PWD/install-Debug/lib:$PYTHONPATH" >> $GITHUB_ENV
        cmake --version
        python --version

    - name: Build ibis
      run: |
        export DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH
        sh ibis/etc/macOS/macos-build-gha.sh Debug

    - name: Run tests
      run: |
        export DYLD_LIBRARY_PATH=$PWD/install-Debug/lib:$DYLD_LIBRARY_PATH
        build-Debug/tests/ibistest/ibistest

  windows-build:
    runs-on: windows-latest

    env:
      JOBS: 4
      IBIS_OCIO: ON
      IBIS_JPEG: ON
      IBIS_TIFF: ON
      IBIS_EXR: ON
      IBIS_FFMPEG: ON
      IBIS_FFMPEG_MINIMAL: OFF
      IBIS_OIIO: ON
      IBIS_USD: OFF
      IBIS_PYTHON: OFF
      IBIS_TESTS: ON
      BUILD_SHARED_LIBS: OFF
      FTK_API: GL_4_1

    steps:
    - uses: actions/checkout@v4
      with:
        path: ibis
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: ilammy/setup-nasm@v1

    # \bug Any spaces before the ">>" will be considered part of the path.
    - name: Setup environment
      shell: cmd
      run: |
        echo %CD%\install-Debug\bin>> %GITHUB_PATH%
        echo %CD%\install-Debug\lib>> %GITHUB_PATH%
        echo CTEST_OUTPUT_ON_FAILURE=1 >> %GITHUB_ENV%
        cmake --version
        python --version
        
    - name: Build ibis
      shell: cmd
      run: ibis\etc\Windows\windows-build-gha.bat Debug

    - name: Run tests
      shell: cmd
      run: build-Debug\tests\ibistest\Debug\ibistest
